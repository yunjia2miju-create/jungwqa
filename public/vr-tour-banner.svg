<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Dark Emerald / Slate Overlay Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" stop-opacity="0.92" />
      <stop offset="50%" stop-color="#1c2541" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.92" />
    </linearGradient>

    <!-- Emerald Glow filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Card Shadow filter -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="#0b132b" />

  <!-- Background Image (Luxury Modern Room) -->
  <image href="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&amp;fit=crop&amp;w=1200&amp;h=630&amp;q=90" x="0" y="0" width="1200" height="630" preserveAspectRatio="xMidYMid slice" />

  <!-- Gradient Overlay -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- VR Tech Grid Lines -->
  <path d="M 0,105 L 1200,105 M 0,210 L 1200,210 M 0,315 L 1200,315 M 0,420 L 1200,420 M 0,525 L 1200,525" stroke="#10b981" stroke-opacity="0.08" stroke-width="1.5" />
  <path d="M 150,0 L 150,630 M 300,0 L 300,630 M 450,0 L 450,630 M 600,0 L 600,630 M 750,0 L 750,630 M 900,0 L 900,630 M 1050,0 L 1050,630" stroke="#10b981" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Outer Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="#10b981" stroke-opacity="0.35" stroke-width="2" />
  <rect x="28" y="28" width="1144" height="574" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />

  <!-- Left Content Area -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="340" height="42" rx="21" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
      <circle cx="24" cy="21" r="6" fill="#10b981" filter="url(#neon-glow)" />
      <text x="42" y="27" font-family="'Malgun Gothic', '맑은 고딕', sans-serif" font-weight="bold" font-size="16" fill="#34d399" letter-spacing="1">GUMI TAEWANG REAL ESTATE</text>
    </g>

    <!-- Main Title 1 -->
    <text x="0" y="200" font-family="'Malgun Gothic', '맑은 고딕', sans-serif" font-weight="900" font-size="46" fill="#ffffff" letter-spacing="-1">구미 태왕공인중개사사무소</text>

    <!-- Main Title 2 (VR Highlight) -->
    <text x="0" y="275" font-family="'Malgun Gothic', '맑은 고딕', sans-serif" font-weight="900" font-size="58" fill="#10b981" filter="url(#neon-glow)" letter-spacing="-1">360° VR 공간 실감 투어</text>

    <!-- Subtitle -->
    <text x="0" y="340" font-family="'Malgun Gothic', '맑은 고딕', sans-serif" font-weight="bold" font-size="24" fill="#e2e8f0" letter-spacing="-0.5">현장 방문 전, 손가락 터치만으로 완벽한 가상 임장 경험!</text>

    <!-- Category Pills -->
    <g transform="translate(0, 395)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="44" rx="10" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
      <text x="65" y="28" text-anchor="middle" font-family="'Malgun Gothic', '맑은 고딕', sans-serif" font-weight="bold" font-size="18" fill="#ffffff">원룸/투룸</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="130" height="44" rx="10" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
      <text x="210" y="28" text-anchor="middle" font-family="'Malgun Gothic', '맑은 고딕', sans-serif" font-weight="bold" font-size="18" fill="#ffffff">오피스텔</text>

      <!-- Pill 3 -->
      <rect x="290" y="0" width="130" height="44" rx="10" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
      <text x="355" y="28" text-anchor="middle" font-family="'Malgun Gothic', '맑은 고딕', sans-serif" font-weight="bold" font-size="18" fill="#ffffff">상가/사무실</text>

      <!-- Pill 4 -->
      <rect x="435" y="0" width="150" height="44" rx="10" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="1.5" />
      <text x="510" y="28" text-anchor="middle" font-family="'Malgun Gothic', '맑은 고딕', sans-serif" font-weight="bold" font-size="18" fill="#34d399">책임 중개 전문</text>
    </g>

    <!-- Contact Info Bar -->
    <g transform="translate(0, 480)">
      <rect x="0" y="0" width="580" height="54" rx="12" fill="#000000" fill-opacity="0.4" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
      <text x="24" y="34" font-family="'Malgun Gothic', '맑은 고딕', sans-serif" font-weight="bold" font-size="20" fill="#f8fafc">대표 남주근 소장  |  직통 문의: 010-7590-0111</text>
    </g>
  </g>

  <!-- Right Play / 360 Interactive Badge -->
  <g transform="translate(970, 315)" filter="url(#card-shadow)">
    <!-- Outer Radar Rings -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="#10b981" stroke-opacity="0.15" stroke-width="2" />
    <circle cx="0" cy="0" r="95" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="3" />
    <circle cx="0" cy="0" r="75" fill="#10b981" fill-opacity="0.15" />

    <!-- Core Button -->
    <circle cx="0" cy="0" r="55" fill="#10b981" filter="url(#neon-glow)" />

    <!-- Play Arrow Icon -->
    <polygon points="-10,-18 20,0 -10,18" fill="#ffffff" />

    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#6ee7b7" stroke-width="2.5" />

    <!-- Click guide text -->
    <text x="0" y="95" text-anchor="middle" font-family="'Malgun Gothic', '맑은 고딕', sans-serif" font-weight="bold" font-size="16" fill="#ffffff" filter="url(#neon-glow)">CLICK TO START</text>
  </g>
</svg>
