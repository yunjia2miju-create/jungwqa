<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Dark Architectural Blueprint Gradients -->
    <linearGradient id="bg-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071126" />
      <stop offset="50%" stop-color="#0b1e3d" />
      <stop offset="100%" stop-color="#050b17" />
    </linearGradient>

    <linearGradient id="ground-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b2b" />
      <stop offset="100%" stop-color="#06161c" />
    </linearGradient>

    <linearGradient id="tower-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a6a" />
      <stop offset="50%" stop-color="#2d5797" />
      <stop offset="100%" stop-color="#132747" />
    </linearGradient>

    <linearGradient id="tower-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22457e" />
      <stop offset="50%" stop-color="#3668b5" />
      <stop offset="100%" stop-color="#162e54" />
    </linearGradient>

    <linearGradient id="gold-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="1200" height="675" fill="url(#bg-sky)" />

  <!-- Geumosan Mountain Silhouettes in Background -->
  <path d="M 0 380 Q 200 240 450 310 T 800 220 Q 1020 280 1200 350 L 1200 675 L 0 675 Z" fill="#0c1d33" opacity="0.6" />
  <path d="M 0 420 Q 260 300 520 370 T 950 290 Q 1100 340 1200 400 L 1200 675 L 0 675 Z" fill="#0e233d" opacity="0.8" />

  <!-- Architectural Grid Lines -->
  <g stroke="#64dfdf" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Landscaped Ground / Site Boundary -->
  <polygon points="120,530 1080,530 1140,640 60,640" fill="url(#ground-grad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="2" />

  <!-- Central Park / Green Oasis -->
  <ellipse cx="600" cy="565" rx="360" ry="45" fill="#064e3b" opacity="0.5" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5" />
  <ellipse cx="600" cy="565" rx="180" ry="22" fill="#047857" opacity="0.6" />

  <!-- 5 Apartment Towers (101동 ~ 105동) -->
  
  <!-- 101동 (Left Front) -->
  <g filter="url(#subtle-shadow)">
    <polygon points="160,200 250,170 290,185 200,215" fill="#3b82f6" opacity="0.9" />
    <polygon points="160,200 200,215 200,530 160,510" fill="url(#tower-grad-1)" stroke="#60a5fa" stroke-opacity="0.4" />
    <polygon points="200,215 290,185 290,500 200,530" fill="url(#tower-grad-2)" stroke="#93c5fd" stroke-opacity="0.5" />
    <!-- Crown Lighting -->
    <line x1="160" y1="200" x2="250" y2="170" stroke="#f59e0b" stroke-width="4" filter="url(#glow)" />
    <!-- Dong Badge -->
    <rect x="180" y="540" width="80" height="26" rx="6" fill="#0b132b" stroke="#fbbf24" stroke-width="1.5" />
    <text x="220" y="558" fill="#fbbf24" font-size="13" font-family="'Pretendard', sans-serif" font-weight="900" text-anchor="middle">101동 (29F)</text>
  </g>

  <!-- 102동 (Center Left Mid) -->
  <g filter="url(#subtle-shadow)">
    <polygon points="360,180 440,155 480,170 400,195" fill="#3b82f6" opacity="0.9" />
    <polygon points="360,180 400,195 400,490 360,470" fill="url(#tower-grad-1)" stroke="#60a5fa" stroke-opacity="0.4" />
    <polygon points="400,195 480,170 480,465 400,490" fill="url(#tower-grad-2)" stroke="#93c5fd" stroke-opacity="0.5" />
    <line x1="360" y1="180" x2="440" y2="155" stroke="#f59e0b" stroke-width="4" filter="url(#glow)" />
    <rect x="380" y="500" width="80" height="26" rx="6" fill="#0b132b" stroke="#64dfdf" stroke-width="1.5" />
    <text x="420" y="518" fill="#64dfdf" font-size="13" font-family="'Pretendard', sans-serif" font-weight="900" text-anchor="middle">102동 (29F)</text>
  </g>

  <!-- 103동 (Center Tower - Landmark) -->
  <g filter="url(#subtle-shadow)">
    <polygon points="560,150 640,125 680,140 600,165" fill="#3b82f6" opacity="0.9" />
    <polygon points="560,150 600,165 600,470 560,450" fill="url(#tower-grad-1)" stroke="#60a5fa" stroke-opacity="0.4" />
    <polygon points="600,165 680,140 680,445 600,470" fill="url(#tower-grad-2)" stroke="#93c5fd" stroke-opacity="0.5" />
    <line x1="560" y1="150" x2="640" y2="125" stroke="#f59e0b" stroke-width="5" filter="url(#glow)" />
    <!-- Hyundai Hillstate H Logo on Top -->
    <circle cx="620" cy="110" r="14" fill="#991b1b" stroke="#f87171" stroke-width="1.5" />
    <text x="620" y="116" fill="#ffffff" font-size="14" font-weight="900" font-family="serif" text-anchor="middle">H</text>
    <rect x="580" y="480" width="80" height="26" rx="6" fill="#0b132b" stroke="#fbbf24" stroke-width="1.5" />
    <text x="620" y="498" fill="#fbbf24" font-size="13" font-family="'Pretendard', sans-serif" font-weight="900" text-anchor="middle">103동 (29F)</text>
  </g>

  <!-- 104동 (Center Right Mid) -->
  <g filter="url(#subtle-shadow)">
    <polygon points="760,180 840,155 880,170 800,195" fill="#3b82f6" opacity="0.9" />
    <polygon points="760,180 800,195 800,490 760,470" fill="url(#tower-grad-1)" stroke="#60a5fa" stroke-opacity="0.4" />
    <polygon points="800,195 880,170 880,465 800,490" fill="url(#tower-grad-2)" stroke="#93c5fd" stroke-opacity="0.5" />
    <line x1="760" y1="180" x2="840" y2="155" stroke="#f59e0b" stroke-width="4" filter="url(#glow)" />
    <rect x="780" y="500" width="80" height="26" rx="6" fill="#0b132b" stroke="#64dfdf" stroke-width="1.5" />
    <text x="820" y="518" fill="#64dfdf" font-size="13" font-family="'Pretendard', sans-serif" font-weight="900" text-anchor="middle">104동 (29F)</text>
  </g>

  <!-- 105동 (Right Front - Penthouse) -->
  <g filter="url(#subtle-shadow)">
    <polygon points="950,200 1040,170 1080,185 990,215" fill="#3b82f6" opacity="0.9" />
    <polygon points="950,200 990,215 990,530 950,510" fill="url(#tower-grad-1)" stroke="#60a5fa" stroke-opacity="0.4" />
    <polygon points="990,215 1080,185 1080,500 990,530" fill="url(#tower-grad-2)" stroke="#93c5fd" stroke-opacity="0.5" />
    <line x1="950" y1="200" x2="1040" y2="170" stroke="#f59e0b" stroke-width="4" filter="url(#glow)" />
    <rect x="970" y="540" width="80" height="26" rx="6" fill="#0b132b" stroke="#34d399" stroke-width="1.5" />
    <text x="1010" y="558" fill="#34d399" font-size="13" font-family="'Pretendard', sans-serif" font-weight="900" text-anchor="middle">105동 (펜트)</text>
  </g>

  <!-- Architectural Compass (방위표) on Top Right -->
  <g transform="translate(1080, 70)" filter="url(#glow)">
    <circle cx="0" cy="0" r="26" fill="#0a192f" stroke="#64dfdf" stroke-width="1.5" />
    <polygon points="0,-20 6,0 -6,0" fill="#ef4444" />
    <polygon points="0,20 6,0 -6,0" fill="#94a3b8" />
    <text x="0" y="-24" fill="#ef4444" font-size="11" font-weight="900" text-anchor="middle">N</text>
  </g>

  <!-- Title Badge Top Left -->
  <g transform="translate(50, 45)">
    <rect width="360" height="52" rx="14" fill="#000000" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
    <circle cx="30" cy="26" r="14" fill="#991b1b" />
    <text x="30" y="31" fill="#ffffff" font-size="15" font-family="serif" font-weight="900" text-anchor="middle">H</text>
    <text x="56" y="22" fill="#64dfdf" font-size="10" font-weight="900" letter-spacing="2">HILLSTATE GUMI THE FIRST</text>
    <text x="56" y="40" fill="#ffffff" font-size="15" font-weight="900">단지 전경 및 배치도 조감 (안내도)</text>
  </g>

  <!-- Bottom Spec Bar -->
  <g transform="translate(60, 600)">
    <rect width="1080" height="54" rx="14" fill="#000000" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="30" y="32" fill="#fbbf24" font-size="13" font-weight="900">구미 봉곡 59-1번지</text>
    <text x="210" y="32" fill="#ffffff" font-size="13" font-weight="700">| 지하 2층 ~ 지상 29층 (5개동 총 491세대)</text>
    <text x="600" y="32" fill="#34d399" font-size="13" font-weight="700">| 100% 지하주차 공원형 단지</text>
    <text x="890" y="32" fill="#64dfdf" font-size="13" font-weight="900">1 배치도-전경 (조감도)</text>
  </g>
</svg>
